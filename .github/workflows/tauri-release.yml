name: tauri-release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  check-release-access:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Test GitHub Release write access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::No GitHub token available."
            exit 1
          fi

          probe_tag="__probe_${GITHUB_RUN_ID}"
          if gh release create "${probe_tag}" --title "permission probe" --notes "probe" --draft; then
            gh release delete "${probe_tag}" --yes
            echo "Release write access OK."
          else
            echo "::error::Cannot create GitHub Releases with the current token."
            echo ""
            echo "Fix option A — enable GITHUB_TOKEN writes:"
            echo "  Repo Settings > Actions > General > Workflow permissions > Read and write permissions"
            echo ""
            echo "Fix option B — use a Personal Access Token:"
            echo "  1. GitHub profile Settings > Developer settings > Personal access tokens > Tokens (classic)"
            echo "  2. Generate token with 'repo' scope"
            echo "  3. Save as RELEASE_TOKEN in repo Settings > Secrets and variables > Actions"
            exit 1
          fi

  build-and-release:
    needs: check-release-access
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs "${{ github.ref_name }}"

      - name: Build + publish GitHub Release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Required for updater artifacts/signing:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SESSION_API_BASE_URL: https://ikke-dev.com.br/
        with:
          # This config enables createUpdaterArtifacts=true
          args: --config src-tauri/tauri.updater.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Automated release."
          releaseDraft: false
          prerelease: false
