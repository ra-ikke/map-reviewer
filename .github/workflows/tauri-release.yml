name: tauri-release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  diagnose-release-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate RELEASE_TOKEN
        env:
          PAT: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/validate-release-token.mjs

  create-release:
    needs: diagnose-release-token
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release notes source
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_FILE=".github/releases/${TAG}.md"
          FALLBACK_FILE=".github/releases/latest.md"
          NOTES_FILE=""

          if [ -f "${TAG_FILE}" ]; then
            NOTES_FILE="${TAG_FILE}"
            echo "use_custom=true" >> "$GITHUB_OUTPUT"
            echo "body_path=${TAG_FILE}" >> "$GITHUB_OUTPUT"
            echo "Using custom release notes: ${TAG_FILE}"
          elif [ -f "${FALLBACK_FILE}" ]; then
            NOTES_FILE="${FALLBACK_FILE}"
            echo "use_custom=true" >> "$GITHUB_OUTPUT"
            echo "body_path=${FALLBACK_FILE}" >> "$GITHUB_OUTPUT"
            echo "Using fallback release notes: ${FALLBACK_FILE}"
          else
            echo "use_custom=false" >> "$GITHUB_OUTPUT"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "No custom release notes file found; using auto-generated notes."
          fi

          # Multiline body for tauri-action `releaseBody` (fills latest.json `notes`)
          {
            echo "body<<EOF"
            if [ -n "${NOTES_FILE}" ]; then
              cat "${NOTES_FILE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (draft)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: true
          prerelease: false
          generate_release_notes: ${{ steps.notes.outputs.use_custom != 'true' }}

  build-and-release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs "${{ github.ref_name }}"

      - name: Build + upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SESSION_API_BASE_URL: https://ikke-dev.com.br/
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          # Critical: tauri-action writes latest.json `notes` from releaseBody (not GitHub release body)
          releaseBody: ${{ needs.create-release.outputs.notes_body }}
          args: --config src-tauri/tauri.updater.conf.json

  publish-release:
    needs: [create-release, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish release
        env:
          PAT: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: node scripts/publish-release.mjs

      - name: Sync updater notes into latest.json
        env:
          PAT: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: node scripts/sync-updater-notes.mjs
